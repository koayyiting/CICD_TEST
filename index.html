
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Capstone Record Management System">
    <title>Capstone Record Management System</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
        }

        main {
            width: min(90%, 720px);
            padding: 3rem;
            text-align: center;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgb(23 32 51 / 12%);
        }

        h1 {
            margin-top: 0;
            font-size: clamp(2rem, 5vw, 3rem);
        }

        p {
            color: #526079;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        a {
            padding: 0.8rem 1.4rem;
            color: #fff;
            background: #1769e0;
            border-radius: 8px;
            text-decoration: none;
        }

        a.secondary {
            color: #1769e0;
            background: #e8f0ff;
        }
    </style>
</head>
<body>
    <main>
        <h1>Capstone Record Management System</h1>
        <p>Manage capstone records and user accounts in one place.</p>
        <div class="actions">
            <a href="static/templates/signup_login.html">Log in or sign up</a>
            <a class="secondary" href="static/templates/query_capstone.html">Browse records</a>
        </div>
    </main>
</body>
</html>
